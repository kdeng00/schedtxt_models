[package]
name = "schedtxt_models"
version = "0.5.4"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Models used for the schedtxt project"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154" }
time = { version = "0.3.55", features = ["formatting", "macros", "parsing", "serde"] }
sqlx = { version = "0.9.1", features = ["runtime-tokio", "tls-native-tls", "postgres", "time", "uuid"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
dotenvy = { version = "0.15.7" }
const_format = { version = "0.2.37" }
josekit = { version = "0.11.0" }
utoipa = { version = "6.0.0", features = ["uuid", "time"] }

[features]
default = ["full"]
full = ["user", "message", "contact", "config", "envy", "token"]
user = []
message = []
contact = []
config = []
envy = []
token = []

[dev-dependencies]
