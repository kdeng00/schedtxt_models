name: Go CI

on: [push, pull_request] # Triggers on push or pull request events

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.3'

      - name: Download dependencies
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MYREPO_TOKEN }}" > ~/.ssh/textsender_models_deploy_key
          chmod 600 ~/.ssh/textsender_models_deploy_key
          ssh-keyscan ${{ vars.MYHOST }} >> ~/.ssh/known_hosts

          eval $(ssh-agent -s)
          ssh-add -v ~/.ssh/textsender_models_deploy_key

          go mod download

      - name: Run tests
        run: go test -v ./... # Runs all tests in the project

      - name: Run linter
        uses: https://github.com/golangci/golangci-lint-action@v8
        with:
          go-version: '1.25.3'
          version: latest
